<!DOCTYPE html>
<html>
<head>
  <title>Image Details Overlay</title>
  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    button {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #3367d6;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Image Details</h2>
  <button id="checkImages">Check Images</button>
  <button id="clearDetails">Clear Image Details</button>
  <script src="popup.js"></script>
</body>
</html>
